name: eXtra Architecture v2 Probe
on:
  push:
    branches:
      - feature/source-inspector-phase1-20261007
    paths:
      - .github/workflows/extra-onboarding-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe eXtra Saudi through Architecture v2
        run: node scripts/onboard-source-v2.mjs --id extra-sa --url https://www.extra.com/en-sa | tee extra-onboarding.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extra-onboarding-v2
          path: extra-onboarding.json

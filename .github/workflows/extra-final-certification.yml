name: eXtra Final Certification
on:
  push:
    branches: [feature/source-inspector-phase1-20261007]
    paths: [.github/workflows/extra-final-certification.yml]
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - name: Certification and canary
        shell: bash
        run: |
          set -o pipefail
          node scripts/certify-extra-final.mjs | tee extra-final.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: extra-final-certification, path: extra-final.json}

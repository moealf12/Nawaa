name: Live Source Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/source-audit.mjs"
      - "server/audit-matrix.mjs"
      - "server/providers/free-storefronts.mjs"
      - "server/url-resolver.mjs"
      - "server/domain-adapters.mjs"
      - "tests/domain-adapters.test.mjs"
      - "scripts/audit-sources.mjs"
      - ".github/workflows/source-audit.yml"
      - "server/providers/jarir.mjs"
      - "server/providers/extra-unbxd.mjs"
      - "server/providers/sharafdg.mjs"
      - "server/providers/swarovski.mjs"
  push:
    paths:
      - "server/source-audit.mjs"
      - "server/audit-matrix.mjs"
      - "server/providers/free-storefronts.mjs"
      - "server/url-resolver.mjs"
      - "server/domain-adapters.mjs"
      - "tests/domain-adapters.test.mjs"
      - "scripts/audit-sources.mjs"
      - "scripts/probe-temu.mjs"
      - "scripts/probe-shein.mjs"
      - "scripts/probe-sephora.mjs"
      - "package*.json"
      - ".github/workflows/source-audit.yml"

jobs:
  phase3-batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: "1", source: jarir, query: "iPhone 17 256GB" }
          - { case: "2", source: jarir, query: "HP laptop" }
          - { case: "3", source: jarir, query: "nawaa-unfindable-943271-20261003" }
          - { case: "4", source: extra, query: "iPhone 17 256GB" }
          - { case: "5", source: extra, query: "HP laptop" }
          - { case: "6", source: extra, query: "nawaa-unfindable-943271-20261003" }
          - { case: "7", source: sharafdg-sa, query: "iPhone 17 256GB" }
          - { case: "8", source: sharafdg-sa, query: "Samsung Galaxy S25" }
          - { case: "9", source: sharafdg-sa, query: "nawaa-unfindable-943271-20261003" }
          - { case: "10", source: swarovski-sa, query: "pendant" }
          - { case: "11", source: swarovski-sa, query: "bracelet" }
          - { case: "12", source: swarovski-sa, query: "nawaa-unfindable-943271-20261003" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Phase III batch 1 live source probe
        env:
          NAWAA_AUDIT_CONCURRENCY: "1"
        run: node scripts/audit-sources.mjs "phase3-${{ matrix.source }}-${{ matrix.case }}.json" --store "${{ matrix.source }}" --query "${{ matrix.query }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-${{ matrix.source }}-${{ matrix.case }}
          path: phase3-${{ matrix.source }}-${{ matrix.case }}.json


  phase3-batch2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: "16", source: ikea-sa, query: "chair" }
          - { case: "17", source: ikea-sa, query: "table" }
          - { case: "18", source: ikea-sa, query: "nawaa-unfindable-943271-20261003" }
          - { case: "22", source: nike-sa, query: "shoes" }
          - { case: "23", source: nike-sa, query: "shirt" }
          - { case: "24", source: nike-sa, query: "nawaa-unfindable-943271-20261003" }
          - { case: "28", source: namshi-sa, query: "shoes" }
          - { case: "29", source: namshi-sa, query: "shirt" }
          - { case: "30", source: namshi-sa, query: "nawaa-unfindable-943271-20261003" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Phase III batch 2 live source probe
        env:
          NAWAA_AUDIT_CONCURRENCY: "1"
        run: node scripts/audit-sources.mjs "phase3-${{ matrix.source }}-${{ matrix.case }}.json" --store "${{ matrix.source }}" --query "${{ matrix.query }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-${{ matrix.source }}-${{ matrix.case }}
          path: phase3-${{ matrix.source }}-${{ matrix.case }}.json


  phase3-batch3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: "31", source: centrepoint-sa, query: "dress" }
          - { case: "32", source: centrepoint-sa, query: "shirt" }
          - { case: "33", source: centrepoint-sa, query: "nawaa-unfindable-943271-20261003" }
          - { case: "34", source: maxfashion-sa, query: "dress" }
          - { case: "35", source: maxfashion-sa, query: "shirt" }
          - { case: "36", source: maxfashion-sa, query: "nawaa-unfindable-943271-20261003" }
          - { case: "37", source: decathlon-sa, query: "shoes" }
          - { case: "38", source: decathlon-sa, query: "backpack" }
          - { case: "39", source: decathlon-sa, query: "nawaa-unfindable-943271-20261003" }
          - { case: "40", source: niceone-sa, query: "perfume" }
          - { case: "41", source: niceone-sa, query: "lipstick" }
          - { case: "42", source: niceone-sa, query: "nawaa-unfindable-943271-20261003" }
          - { case: "43", source: ebay, query: "iPhone 17 256GB" }
          - { case: "44", source: ebay, query: "Canon camera" }
          - { case: "45", source: ebay, query: "nawaa-unfindable-943271-20261003" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Phase III batch 3 live source probe
        env:
          NAWAA_AUDIT_CONCURRENCY: "1"
        run: node scripts/audit-sources.mjs "phase3-${{ matrix.source }}-${{ matrix.case }}.json" --store "${{ matrix.source }}" --query "${{ matrix.query }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-${{ matrix.source }}-${{ matrix.case }}
          path: phase3-${{ matrix.source }}-${{ matrix.case }}.json

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node scripts/audit-sources.mjs source-audit-results.json
      - name: Assert quarantined sources stay out of active routing
        run: node --input-type=module -e "import {configuredFreeStorefronts,quarantinedFreeStorefronts} from './server/providers/free-storefronts.mjs'; const active=configuredFreeStorefronts(); const quarantined=quarantinedFreeStorefronts(); if(active.some(s=>s.id==='shein-sa')) process.exit(1); if(!quarantined.some(s=>s.id==='shein-sa'&&s.disabledReason==='unstable_shein_risk_challenge')) process.exit(1); if(active.some(s=>s.id==='adidas-sa')) process.exit(1); if(!quarantined.some(s=>s.id==='adidas-sa'&&s.disabledReason==='http_403_live_search')) process.exit(1); if(active.some(s=>s.id==='sephora-sa')) process.exit(1); if(!quarantined.some(s=>s.id==='sephora-sa'&&s.disabledReason==='http_403_live_search')) process.exit(1);"
      - name: Probe Temu public search endpoints
        run: node scripts/probe-temu.mjs "iphone 17 case"
      - name: Probe SHEIN public search endpoints
        run: node scripts/probe-shein.mjs "dress"
      - name: Probe Sephora search routes
        run: node scripts/probe-sephora.mjs "dior perfume"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-results
          path: source-audit-results.json

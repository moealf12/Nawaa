name: Live Source Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "server/source-audit.mjs"
      - "server/providers/free-storefronts.mjs"
      - "server/url-resolver.mjs"
      - "server/domain-adapters.mjs"
      - "tests/domain-adapters.test.mjs"
      - "scripts/audit-sources.mjs"
      - "scripts/probe-temu.mjs"
      - "scripts/probe-shein.mjs"
      - "scripts/probe-sephora.mjs"
      - ".github/workflows/source-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/audit-sources.mjs source-audit-results.json
      - name: Probe Temu public search endpoints
        run: node scripts/probe-temu.mjs "iphone 17 case"
      - name: Probe SHEIN public search endpoints
        run: node scripts/probe-shein.mjs "dress"
      - name: Probe Sephora search routes
        run: node scripts/probe-sephora.mjs "dior perfume"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-results
          path: source-audit-results.json

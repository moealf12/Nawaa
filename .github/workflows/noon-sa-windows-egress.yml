name: Noon Saudi Independent Windows Egress Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/noon-sa-windows-egress.yml"
      - "scripts/noon-sa-curl-transport.py"
      - "scripts/noon-sa-curl-evidence.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-windows-egress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-live-egress:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install strict Noon parsers
        run: npm ci --ignore-scripts
      - name: Install ephemeral curl transport
        run: python -m pip install --disable-pip-version-check curl_cffi==0.17.0
      - name: One real Saudi Noon request from Windows cloud egress
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check scripts/noon-sa-curl-evidence.mjs
          python -m py_compile scripts/noon-sa-curl-transport.py
          python scripts/noon-sa-curl-transport.py
      - name: Archive exact-source result, including any denial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-windows-egress
          path: noon-sa-curl-transport.json
          if-no-files-found: warn
          retention-days: 14

name: Noon Live Revision 4 User-Supplied Scraper Trial
on:
  pull_request:
    paths:
      - ".github/workflows/noon-live-revision4-scraper-trial.yml"
      - "workers/python-intelligence/noon_live_revision4_trial.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-one-live-query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi==0.17.0 playwright==1.64.1 playwright-stealth==2.0.3 beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Extract directly from live Noon search without importing saved archive
        run: python workers/python-intelligence/noon_live_revision4_trial.py

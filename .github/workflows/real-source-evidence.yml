name: NAWAA - real-artifact diagnostic offline tests
on:
  push:
    branches:
      - feature/zero-cost-tooling-foundation
    paths:
      - "scripts/report-active-source-coverage.mjs"
      - "server/tooling/source-certification-artifacts.mjs"
      - "server/tooling/source-certification-triage.mjs"
      - "tests/real-source-evidence.test.mjs"
      - ".github/workflows/real-source-evidence.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node --test tests/real-source-evidence.test.mjs

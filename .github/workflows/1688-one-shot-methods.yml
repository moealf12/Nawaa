name: 1688 One-Shot Jarir vs Noon UAE Live Requests

on:
  pull_request:
    paths:
      - ".github/workflows/1688-one-shot-methods.yml"
      - "scripts/1688-one-shot-jarir.mjs"
      - "scripts/1688-one-shot-noon-uae.py"
      - "scripts/1688-one-shot-acceptance.mjs"
      - "src/1688-html-evidence.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 1688-one-shot-methods-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  one-shot-jarir-then-noon-uae:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked Node dependencies without postinstall
        run: npm ci --ignore-scripts
      - name: Jarir-style direct one-query 1688 HTML read and analysis
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/1688-one-shot-jarir.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install equivalent Noon UAE session libraries in ephemeral runner
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all:             beautifulsoup4==4.15.0             lxml==6.1.3             curl_cffi==0.17.0
      - name: Validate source script syntax
        run: python -m py_compile scripts/1688-one-shot-noon-uae.py
      - name: Noon UAE-style session warmup and one actual 1688 HTML search
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/1688-one-shot-noon-uae.py
      - name: Strict catalog acquisition evidence gate (not a publication gate)
        run: node scripts/1688-one-shot-acceptance.mjs
      - name: Upload machine-readable evidence even when access denied
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1688-one-shot-live-evidence
          path: |
            1688-one-shot-jarir.json
            1688-one-shot-noon-uae.json
          if-no-files-found: warn
          retention-days: 14

name: Amazon DE Search Discovery Probe
on:
  pull_request:
    paths:
      - "workers/python-intelligence/amazon_de_search_probe.py"
      - "workers/python-intelligence/test_amazon_de_search_probe.py"
      - ".github/workflows/amazon-de-search-probe.yml"
  workflow_dispatch:
jobs:
  offline-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install "httpx>=0.27,<1" "beautifulsoup4>=4.12,<5"
      - name: Deterministic Amazon DE parsing tests
        run: python -m unittest discover -s workers/python-intelligence -p test_amazon_de_search_probe.py -v
      - name: One bounded live source diagnostic (non-blocking)
        continue-on-error: true
        run: python workers/python-intelligence/amazon_de_search_probe.py --query "iPhone 17" --timeout 10

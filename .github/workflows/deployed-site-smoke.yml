name: Deployed NAWAA 15-Source Pilot Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/smoke-deployed-site.mjs"
      - "src/certified-pilot.mjs"
      - "pilot.html"
      - ".github/workflows/deployed-site-smoke.yml"

concurrency:
  group: deployed-site-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-live-website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test actual deployed Pages, Render HTML, health and three customer queries
        run: node scripts/smoke-deployed-site.mjs
      - name: Save honest real-website evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-website-smoke-report
          path: site-smoke-report/report.json
          if-no-files-found: warn

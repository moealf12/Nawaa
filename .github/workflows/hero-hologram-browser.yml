name: NAWAA Hero Hologram Browser Acceptance

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/nawaa-hero-sculpture.png'
      - 'scripts/hero-hologram-browser.mjs'
      - '.github/workflows/hero-hologram-browser.yml'
  workflow_dispatch:

concurrency:
  group: nawaa-hero-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hero-hologram-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary test-only browser harness
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Confirm system Chrome
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Test original hologram on Chromium and WebKit
        run: node scripts/hero-hologram-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nawaa-hero-hologram-${{ github.sha }}
          path: browser-artifacts/hero-hologram/
          retention-days: 7

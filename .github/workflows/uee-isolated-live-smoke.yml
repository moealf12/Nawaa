name: UEE isolated live network probe
on:
  push:
    branches: [uee-isolated-live-smoke-20261105]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live HTTPS from GitHub runner
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import dns from 'node:dns/promises';
          const hosts = ['example.com', 'www.iana.org', 'www.python.org'];
          let failures = 0;
          for (const host of hosts) {
            const start = performance.now();
            try {
              const ips = await dns.lookup(host, { all: true });
              const response = await fetch('https://' + host + '/', { signal: AbortSignal.timeout(12000), redirect: 'manual', headers: { 'User-Agent': 'UEE-Independent-Live-Test/0.1' } });
              const body = await response.text();
              const result = { host, dnsAddresses: ips.length, httpStatus: response.status, bytes: Buffer.byteLength(body), durationMs: Math.round(performance.now()-start) };
              console.log(JSON.stringify(result));
              if (response.status >= 500 || body.length === 0) failures++;
            } catch (error) {
              failures++;
              console.log(JSON.stringify({host,error: String(error),durationMs:Math.round(performance.now()-start)}));
            }
          }
          if (failures) process.exitCode = 1;
          NODE

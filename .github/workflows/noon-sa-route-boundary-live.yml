name: Noon SA Route Boundary and No-Slash Search Live

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-sa-noslash-search-live.py"
      - "scripts/noon-sa-route-boundary-live.py"
      - ".github/workflows/noon-sa-route-boundary-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-sa-route-boundary
  cancel-in-progress: true

jobs:
  saudi-source-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UAE-proven dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Python syntax and lint
        run: |
          python -m py_compile scripts/noon-sa-noslash-search-live.py scripts/noon-sa-route-boundary-live.py
          ruff check --select E4,E7,E9,F scripts/noon-sa-noslash-search-live.py scripts/noon-sa-route-boundary-live.py
      - name: Live Saudi public homepage and category route comparison
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          python scripts/noon-sa-route-boundary-live.py
          boundary=$?
          python scripts/noon-sa-noslash-search-live.py
          noslash=$?
          echo "SA_ROUTE_PROBE_EXIT=$boundary"
          echo "SA_NOSLASH_SEARCH_EXIT=$noslash"
          if [ "$boundary" -eq 0 ] || [ "$noslash" -eq 0 ]; then
            exit 0
          fi
          exit 1
      - name: Preserve source response diagnostics without raw HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-source-boundary
          path: |
            noon-sa-route-boundary-live.json
            noon-sa-noslash-live.json
          if-no-files-found: warn
          retention-days: 14

name: Noon UAE Multi-Query Live Extraction Matrix

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-uae-multi-query-live.py"
      - "scripts/noon_uae_price_policy.py"
      - "scripts/noon_uae_admission.py"
      - "tests/noon_uae_admission_test.py"
      - "tests/noon_uae_price_policy_test.py"
      - ".github/workflows/noon-uae-multi-query-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-uae-multi-query-live
  cancel-in-progress: true

jobs:
  source-matrix:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - query_id: iphone17
            query: "iPhone 17"
          - query_id: playstation5
            query: "PlayStation 5"
          - query_id: headphones
            query: "headphones"
          - query_id: coffee-machine
            query: "coffee machine"
          - query_id: arabic-earbuds
            query: "سماعات بلوتوث"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned libraries used in verified 55-card UAE extraction
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Validate currency preview contract and essential Python syntax
        run: |
          python -m py_compile scripts/noon-uae-multi-query-live.py scripts/noon_uae_price_policy.py
          ruff check --select E4,E7,E9,F scripts/noon-uae-multi-query-live.py scripts/noon_uae_price_policy.py tests/noon_uae_price_policy_test.py
          python -m unittest discover -s tests -p "noon_uae_price_policy_test.py" -v
          python -m unittest discover -s tests -p "noon_uae_admission_test.py" -v
      - name: Acquire merchant HTML LIVE and validate product cards
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
          NOON_QUERY_ID: ${{ matrix.query_id }}
          NOON_SEARCH_QUERY: ${{ matrix.query }}
        run: python scripts/noon-uae-multi-query-live.py
      - name: Retain per-query diagnostic evidence even when source refuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-uae-live-${{ matrix.query_id }}
          path: noon-uae-search-*.json
          if-no-files-found: warn
          retention-days: 14

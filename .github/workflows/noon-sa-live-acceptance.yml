name: Noon Saudi Live Acceptance

on:
  pull_request:
    paths:
      - "scripts/noon-sa-live-acceptance.mjs"
      - "scripts/noon-sa-transport-matrix.mjs"
      - "scripts/noon-sa-curl-transport.py"
      - "scripts/noon-sa-curl-evidence.mjs"
      - ".github/workflows/noon-sa-live-acceptance.yml"
      - "server/providers/free-storefronts.mjs"
      - "src/noon-sa-catalog.mjs"
      - "src/noon-sa-search-card-evidence.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-sa-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-noon-sa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Install ephemeral Playwright Chromium for isolated live probe
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Live transport differential (session versus real browser)
        continue-on-error: true
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check scripts/noon-sa-transport-matrix.mjs
          node scripts/noon-sa-transport-matrix.mjs
      - name: Archive transport matrix whether access passes or fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-transport-matrix
          path: noon-sa-transport-matrix.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install curl_cffi for ephemeral first-party TLS differential
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check curl_cffi==0.17.0
      - name: Live curl_cffi transport and strict source-price evidence
        continue-on-error: true
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check scripts/noon-sa-curl-evidence.mjs
          python -m py_compile scripts/noon-sa-curl-transport.py
          python scripts/noon-sa-curl-transport.py
      - name: Archive curl_cffi first-party live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-curl-transport
          path: noon-sa-curl-transport.json
          if-no-files-found: warn
          retention-days: 14
      - name: Real Noon Saudi search acquisition (no fixtures, no retry)
        run: node scripts/noon-sa-live-acceptance.mjs
      - name: Persist machine-readable source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-live-acceptance
          path: noon-sa-live-acceptance.json
          if-no-files-found: warn
          retention-days: 14

  macos-curl-egress:
    # Independent hosted runner egress, no proxies or source-side changes.
    runs-on: macos-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - name: Install temporary open-source curl_cffi
        run: python -m pip install --disable-pip-version-check curl_cffi==0.17.0
      - name: Real same-query Saudi Noon transport from macOS
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check scripts/noon-sa-curl-evidence.mjs
          python -m py_compile scripts/noon-sa-curl-transport.py
          python scripts/noon-sa-curl-transport.py
      - name: Archive network comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-macos-curl-transport
          path: noon-sa-curl-transport.json
          if-no-files-found: warn
          retention-days: 14

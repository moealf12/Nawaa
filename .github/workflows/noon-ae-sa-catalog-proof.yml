name: Noon AE SA Real Catalog Proof

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-ae-sa-catalog-proof-live.py"
      - ".github/workflows/noon-ae-sa-catalog-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-ae-sa-source-proof
  cancel-in-progress: true

jobs:
  bounded-crossmarket-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source transport and HTML parser
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Check Python compilation and essential lint
        run: |
          python -m py_compile scripts/noon-ae-sa-catalog-proof-live.py
          ruff check --select E4,E7,E9,F scripts/noon-ae-sa-catalog-proof-live.py
      - name: Live AE first, SA separate, PDP only if live SKU exists
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-ae-sa-catalog-proof-live.py
      - name: Store actual counts, http status and permitted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-ae-sa-live-proof
          path: noon-ae-sa-catalog-proof-live.json
          retention-days: 14
          if-no-files-found: warn

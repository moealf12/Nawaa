name: IKEA Saudi — bounded 5-product read-only qualification
on:
  push:
    branches:
      - feature/zero-cost-tooling-foundation
    paths:
      - "server/tooling/merchant-observation-producer.mjs"
      - "scripts/probe-ikea-batch.mjs"
      - "tests/zero-cost-ikea-batch.test.mjs"
      - ".github/workflows/ikea-readonly-proof.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Probe five distinct IKEA products with image HEAD checks (read only)
        env:
          DATABASE_URL: ""
          NAWAA_ENABLE_BACKGROUND_JOBS: "0"
          NAWAA_ENABLE_CERTIFIED_INGESTION: "0"
        run: node scripts/probe-ikea-batch.mjs

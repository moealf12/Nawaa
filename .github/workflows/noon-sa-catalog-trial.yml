name: Noon SA Catalog Endpoint Trial
on:
  pull_request:
    paths:
      - "workers/python-intelligence/noon_sa_catalog_probe.py"
      - "workers/python-intelligence/noon_sa_curl_cffi_probe.py"
      - "workers/python-intelligence/test_noon_sa_catalog_probe.py"
      - ".github/workflows/noon-sa-catalog-trial.yml"
  workflow_dispatch:
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install "httpx>=0.27,<1" "curl_cffi"
      - name: Validate Noon catalog parsing offline
        run: python -m unittest discover -s workers/python-intelligence -p test_noon_sa_catalog_probe.py -v
      - name: Probe public Saudi catalog endpoint once
        continue-on-error: true
        run: python workers/python-intelligence/noon_sa_catalog_probe.py --query "ايفون 15"
      - name: Probe same catalog with curl_cffi Chrome120
        run: python workers/python-intelligence/noon_sa_curl_cffi_probe.py --query "ايفون 15" --limit 50 --http-version v2
      - name: Check curl_cffi Chrome120 with HTTP 1.1 after H2 stream error
        run: python workers/python-intelligence/noon_sa_curl_cffi_probe.py --query "ايفون 15" --limit 50 --http-version v1


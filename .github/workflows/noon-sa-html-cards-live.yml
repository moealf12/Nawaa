name: Noon Saudi HTML Search Card Live Proof

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-sa-html-cards-live.py"
      - ".github/workflows/noon-sa-html-cards-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-sa-html-card-proof
  cancel-in-progress: true

jobs:
  live-saudi-html-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exactly the packages used for successful Noon UAE HTML extraction
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Syntax and lint gate
        run: |
          python -m py_compile scripts/noon-sa-html-cards-live.py
          ruff check --select E4,E7,E9,F scripts/noon-sa-html-cards-live.py
      - name: REAL Saudi source HTML extraction using UAE-proven code
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-sa-html-cards-live.py
      - name: Keep source facts and diagnosis even if Saudi blocks access
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-html-live-evidence
          path: noon-sa-html-search-live.json
          if-no-files-found: warn
          retention-days: 14

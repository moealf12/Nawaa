name: eXtra v2 Certification Diagnostic
on:
  push:
    branches:
      - feature/source-inspector-phase1-20261007
    paths:
      - .github/workflows/extra-v2-certification-diagnostic.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify live eXtra evidence
        run: node scripts/probe-extra-v2.mjs | tee extra-v2-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extra-v2-evidence
          path: extra-v2-evidence.json

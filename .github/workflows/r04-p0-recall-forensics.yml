name: NAWAA R04 P0 Exact-LIVE Recall Forensics
on:
  pull_request:
    paths:
      - 'scripts/r04-p0-recall-forensics.mjs'
      - '.github/workflows/r04-p0-recall-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nawaa-r04-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  r04-p0-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ''
      MEILI_HOST: ''
      MEILI_MASTER_KEY: ''
      FIRECRAWL_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and deterministic frozen queries
        run: |
          node --check scripts/r04-p0-recall-forensics.mjs
          node --test tests/r04-retail-subject-p3-postdeploy-replay.test.mjs
      - name: Pin current main independently of stale PR base
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "NAWAA_EXPECT_LIVE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "R04_P0_PIN_SHA=$SHA"
      - name: Collect seven read-only production searches
        run: node scripts/r04-p0-recall-forensics.mjs
      - name: Verify main stayed fixed across observation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NAWAA_EXPECT_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$NAWAA_EXPECT_LIVE_SHA"
      - name: Preserve causal evidence even when a request failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nawaa-r04-p0-${{ github.event.pull_request.head.sha || github.sha }}
          path: r04-p0-recall-forensics.json
          retention-days: 14
          if-no-files-found: warn

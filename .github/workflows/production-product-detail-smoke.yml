name: NAWAA Production Product Detail Smoke

on:
  pull_request:
    paths:
      - 'scripts/verify-live-product-detail.mjs'
      - '.github/workflows/production-product-detail-smoke.yml'
      - 'src/product-page.mjs'
      - 'src/product-card-presentation.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nawaa-production-readonly-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-product-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application packages
        run: npm ci --ignore-scripts
      - name: Install ephemeral browser automation (CI only)
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Validate syntax and system Chromium
        run: |
          node --check scripts/verify-live-product-detail.mjs
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      # For post-release audit, manually dispatch ONCE from main only after
      # Render lists the target commit as LIVE. No polling or duplicate deploy.
      # PR runs verify current production without pretending PR SHA is live.
      - name: Read-only live Render health, mobile/desktop DOM and quote handoff
        timeout-minutes: 4
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          MEILI_HOST: ''
          MEILI_MASTER_KEY: ''
          NAWAA_EXPECT_LIVE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
        run: node scripts/verify-live-product-detail.mjs

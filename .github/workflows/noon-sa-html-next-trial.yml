name: Noon Saudi HTML NEXT_DATA Trial
on:
  pull_request:
    paths:
      - "workers/python-intelligence/noon_sa_html_next_probe.py"
      - "workers/python-intelligence/noon_sa_known_urls_probe.py"
      - "workers/python-intelligence/test_noon_sa_known_urls_probe.py"
      - "workers/python-intelligence/test_noon_sa_html_next_probe.py"
      - ".github/workflows/noon-sa-html-next-trial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noon-html-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser and curl_cffi
        run: python -m pip install --disable-pip-version-check "curl_cffi" "httpx>=0.27,<1" "beautifulsoup4>=4.12,<5" "lxml>=5.1,<7"
      - name: Validate NEXT_DATA extraction fixtures
        run: python -m unittest discover -s workers/python-intelligence -p test_noon_sa_html_next_probe.py -v
      - name: Validate supplied Noon URLs and exact SKU fixtures
        run: python -m unittest discover -s workers/python-intelligence -p test_noon_sa_known_urls_probe.py -v
      - name: Inspect user-provided Saudi-en home, laptop search and PDP once each
        run: python workers/python-intelligence/noon_sa_known_urls_probe.py

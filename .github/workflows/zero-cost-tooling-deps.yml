name: Install Zero-Cost Tooling Dependencies
on:
  push:
    branches: [feature/zero-cost-tooling-foundation]
    paths:
      - .github/workflows/zero-cost-tooling-deps.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zero-cost-tooling-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install free open-source dependencies and update lockfile
        run: npm install --save-exact --ignore-scripts zod p-queue pg-boss
      - name: Verify npm lockfile consistency and unit test suite
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Commit validated package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Install pinned zero-cost Zod, p-queue and pg-boss dependencies"
            git push origin HEAD:feature/zero-cost-tooling-foundation
          fi

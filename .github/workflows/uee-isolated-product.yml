name: UEE isolated live product extraction
on:
  push:
    branches: [uee-isolated-live-smoke-20261105]
    paths:
      - 'uee-sandbox/**'
      - '.github/workflows/uee-isolated-product.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-products:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated real-world extraction
        run: node uee-sandbox/live-product-probe.mjs

name: AliExpress Authorized Public HTML Live Extraction

on:
  push:
    branches:
      - experiment/aliexpress-public-html-connector-20261105
    paths:
      - "scripts/aliexpress-public-html-live.py"
      - "scripts/aliexpress-node-parity-live.mjs"
      - "src/aliexpress-search-evidence.mjs"
      - "server/providers/free-storefronts.mjs"
      - "tests/aliexpress-native-structured.test.mjs"
      - "scripts/aliexpress-pdp-evidence-live.py"
      - "scripts/aliexpress-pdp-dom.py"
      - "tests/aliexpress_pdp_dom_test.py"
      - "scripts/aliexpress-browser-dom-live.py"
      - "src/aliexpress-product-evidence.mjs"
      - "tests/aliexpress-product-evidence.test.mjs"
      - "scripts/aliexpress-product-evidence-live.mjs"
      - "scripts/aliexpress-10-intent-live.py"
      - "scripts/aliexpress-browser-dom-smoke.py"
      - "tests/aliexpress_browser_dom_test.py"
      - "tests/aliexpress_public_html_test.py"
      - "tests/aliexpress_pdp_evidence_test.py"
      - ".github/workflows/aliexpress-public-html-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliexpress-authorized-html-live
  cancel-in-progress: true

jobs:
  merchant-ssr-evidence:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - query_id: gaming-ar
            query: "Gaming"
            host: "ar.aliexpress.com"
          - query_id: headphones-global
            query: "headphones"
            host: "www.aliexpress.com"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded free public-HTML parser dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Validate all AliExpress source and PDP parsing contracts
        run: |
          python -m py_compile scripts/aliexpress-public-html-live.py scripts/aliexpress-pdp-evidence-live.py scripts/aliexpress-pdp-dom.py \
            tests/aliexpress_public_html_test.py tests/aliexpress_pdp_evidence_test.py tests/aliexpress_pdp_dom_test.py
          ruff check --select E4,E7,E9,F \
            scripts/aliexpress-public-html-live.py scripts/aliexpress-pdp-evidence-live.py scripts/aliexpress-pdp-dom.py \
            tests/aliexpress_public_html_test.py tests/aliexpress_pdp_evidence_test.py tests/aliexpress_pdp_dom_test.py
          python -m unittest discover -s tests -p "aliexpress*_test.py" -v
          node --test tests/aliexpress-native-structured.test.mjs
      - name: Fetch verified source search HTML once without CAPTCHA token replay
        env:
          HEAD_SHA: ${{ github.sha }}
          ALIEXPRESS_QUERY_ID: ${{ matrix.query_id }}
          ALIEXPRESS_SEARCH_QUERY: ${{ matrix.query }}
          ALIEXPRESS_SEARCH_HOST: ${{ matrix.host }}
          NAWAA_ALIEXPRESS_NODE_PARITY: "1"
        run: python scripts/aliexpress-public-html-live.py
      - name: Compare native Node and Python against identical live merchant HTML
        env:
          ALIEXPRESS_QUERY_ID: ${{ matrix.query_id }}
          ALIEXPRESS_SEARCH_QUERY: ${{ matrix.query }}
        run: node scripts/aliexpress-node-parity-live.mjs
      - name: Remove ephemeral raw merchant HTML and full card snapshots
        if: always()
        run: rm -f nawaa-aliexpress-parity-*.html nawaa-aliexpress-parity-*.cards.json
      - name: Preserve bounded source evidence on failure and success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-search-${{ matrix.query_id }}
          path: aliexpress-live-*.json
          if-no-files-found: warn
          retention-days: 14

  # Broad live category recall is observed, not guaranteed. One policy
  # read plus at most ten sequential public searches. No PDP fan-out.
  merchant-ten-intent-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded source HTML parser
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Enforce matrix source budget and source syntax
        run: |
          python -m py_compile scripts/aliexpress-10-intent-live.py
          ruff check --select E4,E7,E9,F scripts/aliexpress-10-intent-live.py
      - name: Check ten real intents without inventing PDP prices
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/aliexpress-10-intent-live.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("aliexpress-10-intent-live-matrix.json").read_text())
          assert len(data["queries"]) == data["queryCount"] == 10
          assert data["requestsAttempted"] <= 11
          assert data["retries"] == 0
          assert data["proxyUsed"] is False
          assert data["customerPublishable"] is False
          assert data["pdpPriceVerified"] is False
          assert data["productsAccepted"] == sum(x["accepted"] for x in data["queries"])
          assert data["productsAccepted"] == (
              data["productsWithTitleTokenOverlap"] +
              data["productsCrossScriptRelevanceUnverified"]
          )
          assert all(x["customerPublishable"] is False for x in data["queries"])
          print("NAWAA_ALIEXPRESS_MATRIX_SUMMARY",json.dumps({
              "queried": data["queryCount"],
              "queriesWithTrustedSearchCards": data["queriesWithTrustedSearchCards"],
              "queriesWithCrossScriptCandidates": data["queriesWithCrossScriptCandidates"],
              "titleTokenOverlap": data["productsWithTitleTokenOverlap"],
              "crossScriptRelevanceUnverified": data["productsCrossScriptRelevanceUnverified"],
              "searchCardsOnly": data["productsAccepted"],
              "pdpPriceVerified": False,
              "customerPublishable": False
          }))
          PY
      - name: Retain only bounded 10-intent metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-10-intent-live
          path: aliexpress-10-intent-live-matrix.json
          if-no-files-found: warn
          retention-days: 14

  full-search-core-branch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install checked-in backend dependencies without runtime provisioning
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all Search Core contracts at this exact isolated branch SHA
        env:
          NAWAA_TEST_TRANSPORT: fetch
        run: npm test

  # Exact production-import contract, not just the isolated Python adapter.
  native-node-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install checked-in dependencies without provisioning runtimes
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run AliExpress and actual production provider import contracts
        env:
          NAWAA_TEST_TRANSPORT: fetch
        run: |
          node --test \
            tests/aliexpress-native-structured.test.mjs \
            tests/aliexpress-product-url-provenance.test.mjs \
            tests/r04-aliexpress-redirect-identity.test.mjs \
            tests/providers.test.mjs

  # One representative live alias trace. A challenge or blocked PDP remains
  # explicit diagnostic evidence, never a verified offer or CI false positive.
  merchant-alias-lineage-diagnostic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded public PDP parser dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0
      - name: Collect one official redirect without promoting unverified price
        env:
          ALIEXPRESS_ITEM_ID: "1005012743543835"
          ALIEXPRESS_PDP_HOST: "ar.aliexpress.com"
          ALIEXPRESS_ALIAS_TRACE: "1"
        run: |
          python scripts/aliexpress-pdp-evidence-live.py || :
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("aliexpress-pdp-1005012743543835.json").read_text())
          assert doc["customerPublishable"] is False
          assert doc["aliasIdentityVerified"] is False
          assert doc["captchaSolved"] is False
          assert doc["redirectsFollowed"] <= 2
          assert isinstance(doc["conclusion"], str)
          assert doc["conclusion"] != "NOT_STARTED"
          if doc.get("aliasCandidate"):
              assert doc["aliasCandidate"]["customerPublishable"] is False
              assert doc["aliasCandidate"]["originalItemId"] == doc["itemId"]
          print("NAWAA_ALIEXPRESS_ALIAS_DIAGNOSTIC", json.dumps({
              "conclusion": doc["conclusion"],
              "redirectsFollowed": doc["redirectsFollowed"],
              "aliasCandidate": doc.get("aliasCandidate"),
              "pdpPriceVerifiedForOriginalItem": False,
              "customerPublishable": False,
              "domState": doc.get("productIdentity", {}).get("dom", {}).get("state"),
          }))
          PY
      - name: Upload bounded alias-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-alias-lineage
          path: aliexpress-pdp-1005012743543835.json
          if-no-files-found: warn
          retention-days: 14

  # One real headless Chromium page load. The separate smoke proves JS
  # hydration actually executed, while LIVE may legitimately return CAPTCHA.
  # Neither case authorizes a customer price or is treated as empty stock.
  merchant-chromium-dom-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright and free isolated browser dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            playwright==1.56.0 curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
          python -m playwright install --with-deps chromium
      - name: Validate browser DOM safety and parser contracts
        run: |
          python -m py_compile \
            scripts/aliexpress-browser-dom-live.py \
            scripts/aliexpress-browser-dom-smoke.py \
            tests/aliexpress_browser_dom_test.py
          ruff check --select E4,E7,E9,F \
            scripts/aliexpress-browser-dom-live.py \
            scripts/aliexpress-browser-dom-smoke.py \
            tests/aliexpress_browser_dom_test.py
          python -m unittest discover -s tests -p "aliexpress_browser_dom_test.py" -v
      - name: Verify actual JavaScript hydration in a Chromium page
        run: python scripts/aliexpress-browser-dom-smoke.py
      - name: Observe one live AliExpress PDP after Chromium executes JavaScript
        env:
          ALIEXPRESS_ITEM_ID: "1005012743543835"
          ALIEXPRESS_PDP_HOST: "ar.aliexpress.com"
        run: |
          python scripts/aliexpress-browser-dom-live.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(
              "aliexpress-browser-dom-1005012743543835.json"
          ).read_text())
          assert data["customerPublishable"] is False
          assert data["pdpPriceVerified"] is False
          assert data["aliasIdentityVerified"] is False
          assert data["captchaSolved"] is False
          assert data["proxyUsed"] is False
          assert data["loginAttempted"] is False
          assert data["retries"] == 0
          assert data["conclusion"] != "NOT_STARTED"
          print("NAWAA_ALIEXPRESS_CHROMIUM_LIVE_GUARD PASS")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run real browser result through native evidence decision gate
        env:
          ALIEXPRESS_ITEM_ID: "1005012743543835"
        run: node scripts/aliexpress-product-evidence-live.mjs
      - name: Retain bounded privacy-safe DOM evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-browser-dom-evidence
          path: aliexpress-browser-dom-1005012743543835.json
          if-no-files-found: warn
          retention-days: 14

  # PDP attempts remain on-demand: previously verified search is not made
  # RED by expected CAPTCHA/identity/robots blocks in unrelated PDPs.
  merchant-pdp-evidence:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - item_id: "1005012743543835"
            host: "ar.aliexpress.com"
            host_slug: "ar"
          - item_id: "1005009157591241"
            host: "ar.aliexpress.com"
            host_slug: "ar"
          - item_id: "1005006995890595"
            host: "ar.aliexpress.com"
            host_slug: "ar"
          - item_id: "1005012743543835"
            host: "www.aliexpress.com"
            host_slug: "www"
          - item_id: "1005012743543835"
            host: "www.aliexpress.us"
            host_slug: "us"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded free public-HTML parser dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Verify PDP source code and identity regressions
        run: |
          python -m py_compile scripts/aliexpress-public-html-live.py scripts/aliexpress-pdp-evidence-live.py scripts/aliexpress-pdp-dom.py \
            tests/aliexpress_public_html_test.py tests/aliexpress_pdp_evidence_test.py tests/aliexpress_pdp_dom_test.py
          ruff check --select E4,E7,E9,F \
            scripts/aliexpress-public-html-live.py scripts/aliexpress-pdp-evidence-live.py scripts/aliexpress-pdp-dom.py \
            tests/aliexpress_public_html_test.py tests/aliexpress_pdp_evidence_test.py tests/aliexpress_pdp_dom_test.py
          python -m unittest discover -s tests -p "aliexpress*_test.py" -v
      - name: Check real item PDP using clean URL only
        env:
          ALIEXPRESS_ITEM_ID: ${{ matrix.item_id }}
          ALIEXPRESS_PDP_HOST: ${{ matrix.host }}
        run: python scripts/aliexpress-pdp-evidence-live.py
      - name: Preserve bounded PDP evidence on failure and success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-pdp-${{ matrix.item_id }}-${{ matrix.host_slug }}
          path: aliexpress-pdp-*.json
          if-no-files-found: warn
          retention-days: 14

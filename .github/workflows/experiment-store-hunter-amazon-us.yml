name: EXPERIMENT Amazon US Store Hunter Live (no-deploy)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - experiments/store-hunter-amazon-us/**
      - .github/workflows/experiment-store-hunter-amazon-us.yml

permissions:
  contents: read

concurrency:
  group: experiment-store-hunter-amazon-us-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amazon-us-live:
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/store-hunter-amazon-us-isolated-20261105'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight standalone extractor dependencies
        run: python -m pip install --disable-pip-version-check 'httpx>=0.27,<1' 'beautifulsoup4>=4.12,<5'
      - name: Verify isolated Python files and Amazon card invariants
        run: |
          python -m py_compile experiments/store-hunter-amazon-us/*.py
          python -m unittest discover -s experiments/store-hunter-amazon-us -p 'test_*.py' -v
      - name: Ten independent Amazon US LIVE query intents with price-image-ASIN verification
        env:
          PYTHONPATH: experiments/store-hunter-amazon-us
        run: python experiments/store-hunter-amazon-us/amazon_us_ten_query_live.py
      - name: Preserve real live results and diagnostics regardless of pass/fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-amazon-us-store-hunter-live-macos-15
          path: artifacts/amazon-us-ten-live-intents.json
            artifacts/amazon-us-inline-json-forensics.json
          if-no-files-found: warn
          retention-days: 3

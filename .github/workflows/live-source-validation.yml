name: Live Source Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/providers/free-storefronts.mjs"
      - "scripts/validate-live-sources.mjs"
      - ".github/workflows/live-source-validation.yml"
  pull_request:
    paths:
      - "server/providers/free-storefronts.mjs"
      - "scripts/validate-live-sources.mjs"
      - ".github/workflows/live-source-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Probe expanded storefronts
        run: npm run validate:sources
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-validation
          path: live-source-validation.json
          if-no-files-found: warn

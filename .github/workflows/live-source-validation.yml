name: Live Source Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/providers/free-storefronts.mjs"
      - "scripts/validate-live-sources.mjs"
      - ".github/workflows/live-source-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe expanded storefronts
        run: npm run validate:sources

name: 1688 Jarir vs Noon UAE Live Method Comparison

on:
  pull_request:
    paths:
      - ".github/workflows/1688-method-comparison-live.yml"
      - "scripts/1688-jarir-style-live.mjs"
      - "scripts/1688-noon-uae-style-live.py"
      - "src/1688-html-evidence.mjs"
      - "src/1688-public-discovery.mjs"
      - "tests/1688-html-evidence.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 1688-method-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jarir-then-noon-uae:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Test HTML parser and source boundaries
        run: node --test tests/1688-html-evidence.test.mjs tests/1688-public-discovery.test.mjs tests/1688-cn-staged.test.mjs
      - name: Jarir-style actual first-party HTML/JSON-LD experiment (no publication)
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/1688-jarir-style-live.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install same ephemeral libraries as Noon session forensics
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all:             beautifulsoup4==4.15.0             lxml==6.1.3             curl_cffi==0.17.0
      - name: Python syntax check
        run: python -m py_compile scripts/1688-noon-uae-style-live.py
      - name: Noon UAE-style real curl_cffi persistent HTML-session experiment
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/1688-noon-uae-style-live.py
      - name: Preserve bounded real-source evidence (never HTML or session cookies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1688-jarir-vs-noon-uae-live
          path: |
            1688-jarir-style-live.json
            1688-noon-uae-style-live.json
          if-no-files-found: warn
          retention-days: 14

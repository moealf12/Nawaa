name: UEE isolated polyglot live benchmark
on:
  push:
    branches: [uee-isolated-live-smoke-20261105]
    paths: ['uee-sandbox/polyglot/**', '.github/workflows/uee-polyglot-live.yml']
permissions:
  contents: read
jobs:
  polyglot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test four-language live pipeline
        run: |
          set -euo pipefail
          node uee-sandbox/polyglot/acquire.mjs
          python uee-sandbox/polyglot/extract.py
          go run uee-sandbox/polyglot/frontier.go
          rustc -O uee-sandbox/polyglot/check.rs -o /tmp/uee-check
          /tmp/uee-check
          cat uee-sandbox/polyglot/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uee-polyglot-live-evidence
          path: uee-sandbox/polyglot/results.json
          if-no-files-found: warn

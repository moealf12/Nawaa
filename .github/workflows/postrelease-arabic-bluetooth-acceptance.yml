name: NAWAA Postrelease Arabic Bluetooth Browser Acceptance
on:
  pull_request:
    paths:
      - 'scripts/postrelease-arabic-bluetooth-acceptance.mjs'
      - '.github/workflows/postrelease-arabic-bluetooth-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-customer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app dependencies
        run: npm ci --ignore-scripts
      - name: Install ephemeral free browser test package
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Confirm system Chromium
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Validate published Arabic search and real mobile and desktop customer journey
        env:
          NODE_ENV: 'test'
          NAWAA_BROWSER_QUERY: 'سماعات بلوتوث'
        run: node scripts/browser-customer-journey.mjs published
  postrelease-exact-api-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only exact release health + source-owned Arabic JSON and independent SSE
        env:
          NAWAA_EXPECT_LIVE_SHA: '1fc1a1380e8a83845a0c11ff9dbd3499fec21de0'
        run: node scripts/postrelease-arabic-bluetooth-acceptance.mjs

name: NAWAA Python Intelligence P1-P2
on:
  pull_request:
    paths:
      - "workers/python-intelligence/**"
      - "src/python-worker-bridge.mjs"
      - ".github/workflows/python-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "workers/python-intelligence/**"
      - "src/python-worker-bridge.mjs"
      - ".github/workflows/python-intelligence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/python-intelligence/pyproject.toml
      - name: Install requested open-source libraries
        run: |
          cd workers/python-intelligence
          python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Check Python 3.12 and all dependencies
        run: |
          python -c "import sys,httpx,bs4,lxml,pydantic,rapidfuzz,pytest,hypothesis; assert sys.version_info[:2] == (3,12); print('PYTHON_312_ALL_DEPENDENCIES_INSTALLED')"
      - name: Run Python direct extraction and Hypothesis tests
        run: |
          cd workers/python-intelligence
          python -m pytest tests/test_classifier.py -q -ra
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node to Python JSON Lines subprocess tests
        run: node --test workers/python-intelligence/tests/node-bridge.test.mjs
      - name: Exercise two real Python CLI requests
        run: |
          cd workers/python-intelligence
          printf '%s\n' \
            '{"schemaVersion":"nawaa.python.extract.v1","requestId":"ci-1","sourceId":"jarir-sa","operation":"classify","input":{"expected":{"model":"PS5 Digital"},"observed":{"model":"PS5 Disc"}}}' \
            '{"schemaVersion":"nawaa.python.extract.v1","requestId":"ci-2","sourceId":"jarir-sa","operation":"classify","input":{"expected":{"model":"Edge 540"},"observed":{"model":"Edge 540 Solar"}}}' \
            | python -m nawaa_py.cli
      - name: Package complete Python source, tests, Node bridge and instructions
        if: always()
        run: |
          tar --exclude='__pycache__' --exclude='.pytest_cache' --exclude='.hypothesis' --exclude='*.pyc' \
            -czf nawaa-python-intelligence-source.tar.gz \
            workers/python-intelligence src/python-worker-bridge.mjs \
            .github/workflows/python-intelligence.yml
      - name: Upload complete implementation archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nawaa-python-intelligence-source
          path: nawaa-python-intelligence-source.tar.gz
          retention-days: 7
          if-no-files-found: warn
  python-public-source-trial:
    needs: python-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python extraction stack
        run: |
          cd workers/python-intelligence
          python -m pip install --disable-pip-version-check -e .
      - name: Real HTTPX public retailer experiment without bypass
        env:
          NAWAA_PY_LIVE_ENABLED: "1"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          cd workers/python-intelligence
          python -m nawaa_py.live_trial

name: Jarir Python User Waterfall Trial
on:
  pull_request:
    paths:
      - "workers/python-intelligence/experiments/**"
      - "workers/python-intelligence/tests/test_jarir_user_waterfall.py"
      - ".github/workflows/jarir-python-user-trial.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jarir-offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/python-intelligence/pyproject.toml
      - name: Install existing Python project test dependencies
        run: |
          cd workers/python-intelligence
          python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Strict Jarir waterfall tests including Hypothesis
        run: |
          cd workers/python-intelligence
          python -m pytest tests/test_jarir_user_waterfall.py -q -ra
      - name: Existing Python extraction suite
        run: |
          cd workers/python-intelligence
          python -m pytest tests/test_classifier.py -q -ra
      - name: JSON Lines real CLI error-frame smoke
        run: |
          cd workers/python-intelligence
          printf '%s\n' '{"schemaVersion":"nawaa.jarir.experimental.v1","requestId":"smoke","url":"https://example.com/"}' | python -m experiments.jarir_user_waterfall
  jarir-real-public-page:
    needs: jarir-offline-validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Python extractor dependencies
        run: |
          cd workers/python-intelligence
          python -m pip install --disable-pip-version-check -e .
      - name: Single direct Jarir iPhone 17 SKU 666784 HTTPX experiment
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "*"
        run: |
          cd workers/python-intelligence
          python -m experiments.run_jarir_user_trial

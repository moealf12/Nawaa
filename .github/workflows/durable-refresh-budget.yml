name: NAWAA - atomic refresh request budget in disposable PostgreSQL
on:
  push:
    branches:
      - feature/zero-cost-tooling-foundation
    paths:
      - "server/tooling/durable-refresh-budget.mjs"
      - "scripts/test-refresh-budget-ephemeral.mjs"
      - ".github/workflows/durable-refresh-budget.yml"
permissions:
  contents: read
jobs:
  atomic-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nawaa
          POSTGRES_PASSWORD: nawaa_ci
          POSTGRES_DB: nawaa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawaa -d nawaa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nawaa:nawaa_ci@localhost:5432/nawaa_ci
      DATABASE_SSL: "false"
      NAWAA_ENABLE_BACKGROUND_JOBS: "1"
      NAWAA_ENABLE_REFRESH_BUDGET: "1"
      NAWAA_CI_EPHEMERAL_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node scripts/test-refresh-budget-ephemeral.mjs

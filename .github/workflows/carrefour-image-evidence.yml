name: NAWAA - offline Carrefour image evidence safety
on:
  push:
    branches:
      - feature/zero-cost-tooling-foundation
    paths:
      - "server/tooling/carrefour-image-evidence.mjs"
      - "tests/carrefour-image-evidence.test.mjs"
      - "tests/carrefour-product-image-proof.test.mjs"
      - "server/tooling/carrefour-product-image-proof.mjs"
      - "server/tooling/carrefour-image-pilot.mjs"
      - "tests/carrefour-image-pilot.test.mjs"
      - "scripts/probe-carrefour-image-evidence.mjs"
      - ".github/workflows/carrefour-image-evidence.yml"
permissions:
  contents: read
jobs:
  inspect-one-off:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DATABASE_URL: ""
      NAWAA_ENABLE_BACKGROUND_JOBS: "0"
      NAWAA_SINGLE_CARREFOUR_IMAGE_PROBE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node --test tests/carrefour-image-evidence.test.mjs
      - name: Validate official PDP image identity and AED price parity offline
        run: node --test tests/carrefour-product-image-proof.test.mjs
      - name: Validate explicit one-SKU pilot authorization offline
        run: node --test tests/carrefour-image-pilot.test.mjs

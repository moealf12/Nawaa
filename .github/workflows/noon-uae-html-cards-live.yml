name: Noon UAE HTML Search Card Live Proof

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-uae-html-cards-live.py"
      - ".github/workflows/noon-uae-html-cards-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-uae-html-card-proof
  cancel-in-progress: true

jobs:
  live-uae-html-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned HTML parser and transport
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Python syntax and lint
        run: |
          python -m py_compile scripts/noon-uae-html-cards-live.py
          ruff check --select E4,E7,E9,F scripts/noon-uae-html-cards-live.py
      - name: Real UAE product search cards with price, image and SKU diagnostics
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-uae-html-cards-live.py
      - name: Archive real HTML extraction proof without raw merchant HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-uae-html-extraction
          path: noon-uae-html-search-live.json
          if-no-files-found: warn
          retention-days: 14

name: Noon UAE Independent LIVE Session Stability

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-uae-stability-live.py"
      - "scripts/noon_uae_request_policy.py"
      - ".github/workflows/noon-uae-stability-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-uae-stability-live
  cancel-in-progress: true

jobs:
  three-independent-source-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned source transport and HTML parser
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Python syntax and correctness
        run: |
          python -m py_compile scripts/noon-uae-stability-live.py scripts/noon_uae_request_policy.py
          ruff check --select E4,E7,E9,F scripts/noon-uae-stability-live.py scripts/noon_uae_request_policy.py
      - name: LIVE source snapshot — 3 cookie jars / 3 queries / max 6 requests
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-uae-stability-live.py
      - name: Persist every real observation including source denials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-uae-session-stability
          path: noon-uae-stability-live.json
          if-no-files-found: warn
          retention-days: 14

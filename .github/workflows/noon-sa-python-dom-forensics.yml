name: Noon Saudi Python DOM Forensics — Live

on:
  pull_request:
    paths:
      - "scripts/noon-sa-python-dom-forensics.py"
      - ".github/workflows/noon-sa-python-dom-forensics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-sa-python-dom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-html-triple-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned parsing and transport libraries (ephemeral only)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            beautifulsoup4==4.15.0 \
            lxml==6.1.3 \
            selectolax==1.0.2 \
            curl_cffi==0.17.0 \
            ruff
      - name: Syntax, import and lint guard
        run: |
          python -m py_compile scripts/noon-sa-python-dom-forensics.py
          ruff check --select E4,E7,E9,F scripts/noon-sa-python-dom-forensics.py
      - name: Live source HTML with independent BeautifulSoup lxml Lexbor extraction
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/noon-sa-python-dom-forensics.py
      - name: Preserve facts without source HTML or personal tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-python-dom-forensics
          path: noon-sa-python-dom-live.json
          if-no-files-found: warn
          retention-days: 14

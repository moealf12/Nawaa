name: Amazon DE Chromium Discovery Trial
on:
  pull_request:
    paths:
      - "workers/python-intelligence/amazon_de_browser_probe.py"
      - "workers/python-intelligence/amazon_de_search_probe.py"
      - ".github/workflows/amazon-de-browser-probe.yml"
  workflow_dispatch:
jobs:
  chromium-source-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: |
          python -m pip install "playwright>=1.48,<2" "beautifulsoup4>=4.12,<5" "httpx>=0.27,<1"
          python -m playwright install --with-deps chromium
      - name: Inspect public Amazon DE search once
        run: python workers/python-intelligence/amazon_de_browser_probe.py

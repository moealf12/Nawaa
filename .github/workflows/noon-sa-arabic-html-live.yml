name: Noon Saudi Arabic HTML Live Diagnostic

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-sa-arabic-html-live.py"
      - ".github/workflows/noon-sa-arabic-html-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-sa-arabic-html-diagnostic
  cancel-in-progress: true

jobs:
  live-saudi-arabic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned UAE-proven libraries
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Syntax and lint
        run: |
          python -m py_compile scripts/noon-sa-arabic-html-live.py
          ruff check --select E4,E7,E9,F scripts/noon-sa-arabic-html-live.py
      - name: Live Saudi Arabic HTML source and card extraction (not customer publish)
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-sa-arabic-html-live.py
      - name: Save source evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-sa-arabic-live-evidence
          path: noon-sa-arabic-html-live.json
          retention-days: 14
          if-no-files-found: warn

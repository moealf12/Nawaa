name: NAWAA LIVE iPhone Merchant UI Acceptance
on:
  pull_request:
    paths:
      - "scripts/verify-live-iphone-extra-ui.mjs"
      - ".github/workflows/live-iphone-extra-ui.yml"
permissions:
  contents: read
jobs:
  real-iphone-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Exact-sha mobile Chromium iPhone merchant visibility
        env:
          NAWAA_EXPECT_LIVE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-live-iphone-extra-ui.mjs

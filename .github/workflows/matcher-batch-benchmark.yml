name: NAWAA Isolated Match CPU Benchmark

on:
  pull_request:
    paths:
      - 'src/search-query.mjs'
      - 'server/server.mjs'
      - 'tests/matcher-batch-intent.test.mjs'
      - 'scripts/benchmark-matcher-batch.mjs'
      - '.github/workflows/matcher-batch-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matcher-cpu-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact semantic parity and variant identity
        run: node --test tests/matcher-batch-intent.test.mjs
      - name: Paired CPU comparison on synthetic offers only
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          MEILI_HOST: ''
          MEILI_MASTER_KEY: ''
        run: node scripts/benchmark-matcher-batch.mjs

name: 1688 Mobile Storefront Live Evidence (Draft Only)

on:
  pull_request:
    paths:
      - ".github/workflows/1688-mobile-home-live.yml"
      - "scripts/1688-mobile-home-live.mjs"
      - "src/1688-mobile-home-evidence.mjs"
      - "tests/1688-mobile-home-evidence.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 1688-mobile-home-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-1688-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts
      - name: Validate mobile parser contracts
        run: node --test tests/1688-mobile-home-evidence.test.mjs
      - name: Install optional Playwright for a single native mobile fallback
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.64.1
      - name: Resolve preinstalled Chrome
        run: |
          if command -v google-chrome-stable >/dev/null; then
            echo "NAWAA_CHROME_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "NAWAA_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "NAWAA_CHROME_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Observe live m.1688.com mobile storefront (no token, no publication)
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/1688-mobile-home-live.mjs
      - name: Explicit evidence gate — mobile cards are NOT purchasable offers
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("1688-mobile-home-live.json","utf8"));
            const counts=r.stages.map(s=>({transport:s.transport,state:s.state,
              cards:s.evidence?.promotionalCards||0,
              priceCandidates:s.evidence?.visiblePriceCandidatesCny||0,
              canonicalIds:s.evidence?.canonicalOfferIds||0}));
            console.log(JSON.stringify({conclusion:r.conclusion,stages:counts,
              customerPublishable:r.customerPublishable,pdpPricesVerified:r.pdpPricesVerified||0}));
            if(r.conclusion!=="LIVE_MOBILE_PROMOTIONS_OBSERVED_UNVERIFIED")process.exit(1);
          '
      - name: Preserve diagnostic artifact even if blocked or empty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1688-mobile-home-live
          path: 1688-mobile-home-live.json
          if-no-files-found: warn
          retention-days: 14

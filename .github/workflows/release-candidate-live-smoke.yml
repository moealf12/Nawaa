name: NAWAA Release Candidate Live Smoke
on:
  pull_request:
    paths:
      - 'scripts/diagnose-candidate-search.mjs'
      - 'scripts/*latency*.mjs'
      - '.github/workflows/release-candidate-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nawaa-release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-source-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Test disposable candidate HTTP API and live storefronts (no production writes)
        env:
          DATABASE_URL: ''
          MEILI_HOST: ''
          MEILI_MASTER_KEY: ''
          NODE_ENV: test
        run: node scripts/diagnose-candidate-search.mjs
      - name: Repeat cold and warm candidate timings (observational, not P95 certification)
        env:
          LATENCY_SAMPLES: '3'
          LATENCY_OUTPUT: latency-results.json
          DATABASE_URL: ''
          MEILI_HOST: ''
          MEILI_MASTER_KEY: ''
        run: node scripts/measure-search-latency.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-latency-${{ github.event.pull_request.head.sha || github.sha }}
          path: latency-results.json
          retention-days: 7

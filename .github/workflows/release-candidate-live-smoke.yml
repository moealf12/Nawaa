name: NAWAA Release Candidate Live Smoke
on:
  pull_request:
    paths:
      - 'scripts/diagnose-candidate-search.mjs'
      - 'scripts/*latency*.mjs'
      - 'src/search-first-offer-metrics.mjs'
      - 'src/search-coverage-status.mjs'
      - 'scripts/measure-representative-first-offer.mjs'
      - 'scripts/simulate-source-first-offer.mjs'
      - 'tests/search-first-offer-source-simulation.test.mjs'
      - 'scripts/benchmark-match-filter.mjs'
      - 'server/search-index.mjs'
      - 'server/persistence.mjs'
      - 'src/search-query.mjs'
      - 'server/server.mjs'
      - 'server/providers/extra-unbxd.mjs'
      - 'scripts/probe-extra-fields.mjs'
      - 'tests/extra-unbxd-json-parity.test.mjs'
      - 'tests/search-stream-pagination.test.mjs'
      - '.github/workflows/release-candidate-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nawaa-release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-source-candidate:
    runs-on: ubuntu-latest
    # Multi-source SSE and controlled A/B latency need room beyond npm install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Test disposable candidate HTTP API and live storefronts (no production writes)
        env:
          DATABASE_URL: ''
          MEILI_HOST: ''
          MEILI_MASTER_KEY: ''
          NODE_ENV: test
        run: node scripts/diagnose-candidate-search.mjs
      - name: Bounded cross-intent first-offer SSE (one request per query, no retries)
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          MEILI_HOST: ''
          MEILI_MASTER_KEY: ''
        run: node scripts/measure-representative-first-offer.mjs
      - name: Probe Unbxd projection safely (no change to customer-facing request)
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          NAWAA_PROFILE_EXTRA: '1'
          NAWAA_PROFILE_EXTRA_SPLIT_JSON: '1'
        run: node scripts/probe-extra-fields.mjs
      - name: Check out exact production main SHA as causal A/B baseline on the same runner
        uses: actions/checkout@v4
        with:
          ref: c9ddf054c07315bf12ef68c7bd4781345b66cc6d
          path: .latency-baseline
          persist-credentials: false
      - name: Verify identical locked production dependencies for the baseline
        run: |
          # Dev-only lint/property tooling legitimately changes the candidate
          # lockfile, but must not change the comparable production closure.
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const load = path => JSON.parse(readFileSync(path, 'utf8'));
          const candidate = load('package-lock.json');
          const baseline = load('.latency-baseline/package-lock.json');
          assert.deepEqual(candidate.packages[''].dependencies,
            baseline.packages[''].dependencies,
            'runtime direct dependency declarations must remain identical');
          const production = lock => Object.entries(lock.packages)
            .filter(([path, entry]) => path !== '' && entry.dev !== true)
            .map(([path, entry]) => [path, entry.version || null,
              entry.resolved || null, entry.integrity || null])
            .sort((a, b) => a[0].localeCompare(b[0]));
          assert.deepEqual(production(candidate), production(baseline),
            'full production dependency graph must match for valid A/B comparison');
          console.log('Production dependency parity verified; dev-only tools excluded');
          NODE
          ln -s "$GITHUB_WORKSPACE/node_modules" .latency-baseline/node_modules
      - name: Controlled normalization CPU A/B and cross-version semantic equivalence
        run: node scripts/benchmark-query-normalization.mjs .latency-baseline .
      - name: Check matching semantics and benchmark filtering on one CPU
        run: node scripts/benchmark-match-filter.mjs .latency-baseline .
      - name: Alternate baseline and candidate cold/warm measurements (not P95 certification)
        env:
          LATENCY_SAMPLES: '3'
          NAWAA_PROFILE_EXTRA: '1'
          NAWAA_PROFILE_EXTRA_SPLIT_JSON: '1'
          NAWAA_PROFILE_STREAM: '1'
          LATENCY_OUTPUT: latency-results.json
          DATABASE_URL: ''
          MEILI_HOST: ''
          MEILI_MASTER_KEY: ''
        run: node scripts/measure-search-latency.mjs .latency-baseline .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-latency-${{ github.event.pull_request.head.sha || github.sha }}
          path: latency-results.json
          retention-days: 7

name: NAWAA iPhone SSE Merchant Parity
on:
  pull_request:
    paths:
      - "scripts/verify-iphone-sse-merchant-parity.mjs"
      - ".github/workflows/iphone-sse-merchant-parity.yml"
permissions:
  contents: read
jobs:
  public-live-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/verify-iphone-sse-merchant-parity.mjs
      - name: Compare one iPhone SSE lifecycle with one JSON query on exact LIVE commit
        env:
          NAWAA_EXPECT_LIVE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-iphone-sse-merchant-parity.mjs

name: Noon Revision 3 HTTP2 and Stealth API Trial
on:
  pull_request:
    paths:
      - ".github/workflows/noon-revision3-http2-stealth.yml"
      - "workers/python-intelligence/noon_revision3_browser_trial.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install user-requested browser dependencies
        run: python -m pip install playwright==1.64.1 playwright-stealth==2.0.3
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Test v2 page-scoped Stealth call on local HTML and one Chromium HTTP2 experiment
        run: python workers/python-intelligence/noon_revision3_browser_trial.py

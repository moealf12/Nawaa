name: Noon UAE PDP Offer Structure Live

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-uae-pdp-evidence-discovery-live.py"
      - "scripts/noon_uae_embedded_offer.py"
      - "scripts/noon_uae_tsr_ast.py"
      - "tests/noon_uae_tsr_ast_test.py"
      - "scripts/noon_uae_request_policy.py"
      - "scripts/noon_uae_price_policy.py"
      - "scripts/noon_uae_delivery_policy.py"
      - "scripts/noon_uae_partner_attestation.py"
      - "scripts/noon_uae_admission.py"
      - "scripts/noon_uae_price_precision.py"
      - "tests/noon_uae_price_precision_test.py"
      - "tests/noon_uae_admission_test.py"
      - "tests/noon_uae_delivery_policy_test.py"
      - "tests/noon_uae_embedded_offer_test.py"
      - "tests/noon_uae_request_policy_test.py"
      - "tests/noon_uae_price_policy_test.py"
      - ".github/workflows/noon-uae-pdp-evidence-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-uae-pdp-structure-live
  cancel-in-progress: true

jobs:
  live-pdp-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned source transport and DOM parser
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 cryptography==46.0.4 ruff
          python -m pip install --disable-pip-version-check esprima==4.0.1
      - name: Verify syntax and Python correctness
        run: |
          python -m py_compile scripts/noon-uae-pdp-evidence-discovery-live.py scripts/noon_uae_price_policy.py scripts/noon_uae_embedded_offer.py scripts/noon_uae_request_policy.py scripts/noon_uae_tsr_ast.py scripts/noon_uae_delivery_policy.py scripts/noon_uae_partner_attestation.py scripts/noon_uae_admission.py scripts/noon_uae_price_precision.py tests/noon_uae_price_precision_test.py tests/noon_uae_admission_test.py tests/noon_uae_delivery_policy_test.py tests/noon_uae_embedded_offer_test.py tests/noon_uae_request_policy_test.py tests/noon_uae_tsr_ast_test.py
          ruff check --select E4,E7,E9,F scripts/noon-uae-pdp-evidence-discovery-live.py scripts/noon_uae_price_policy.py scripts/noon_uae_embedded_offer.py scripts/noon_uae_request_policy.py scripts/noon_uae_tsr_ast.py scripts/noon_uae_delivery_policy.py scripts/noon_uae_partner_attestation.py scripts/noon_uae_admission.py scripts/noon_uae_price_precision.py tests/noon_uae_price_precision_test.py tests/noon_uae_admission_test.py tests/noon_uae_delivery_policy_test.py tests/noon_uae_embedded_offer_test.py tests/noon_uae_request_policy_test.py tests/noon_uae_tsr_ast_test.py
      - name: Strict price and source-request safety contracts
        run: python -m unittest discover -s tests -p 'noon_uae_*_test.py' -v
      - name: Actual live offer-linked PDP source structure
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-uae-pdp-evidence-discovery-live.py
      - name: Archive bounded structural evidence even if PDP is denied
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-uae-pdp-structure-evidence
          path: noon-uae-pdp-structure-live.json
          if-no-files-found: warn
          retention-days: 14

name: Noon UAE PDP Offer Structure Live

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-uae-pdp-evidence-discovery-live.py"
      - ".github/workflows/noon-uae-pdp-evidence-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-uae-pdp-structure-live
  cancel-in-progress: true

jobs:
  live-pdp-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned source transport and DOM parser
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Verify syntax and Python correctness
        run: |
          python -m py_compile scripts/noon-uae-pdp-evidence-discovery-live.py scripts/noon_uae_price_policy.py
          ruff check --select E4,E7,E9,F scripts/noon-uae-pdp-evidence-discovery-live.py scripts/noon_uae_price_policy.py
      - name: Actual live offer-linked PDP source structure
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-uae-pdp-evidence-discovery-live.py
      - name: Archive bounded structural evidence even if PDP is denied
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-uae-pdp-structure-evidence
          path: noon-uae-pdp-structure-live.json
          if-no-files-found: warn
          retention-days: 14

name: Search Core Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Run test suite
        run: npm test
      - name: Live Crawlee smoke test against Jarir Saudi
        if: github.head_ref == 'feature/crawlee-local-ingestion-20261006'
        continue-on-error: true
        run: node scripts/test-crawlee-local.mjs
      - name: Syntax check browser and server modules
        run: |
          node --check src/search-query.mjs
          node --check src/search-page.mjs
          node --check src/product-page.mjs
          node --check server/server.mjs
          node --check server/search-cache.mjs
          node --check server/source-reliability.mjs
          node --check server/providers/ebay.mjs
          node --check server/providers/shopify.mjs
          node --check server/providers/extra-unbxd.mjs
          node --check server/providers/jarir.mjs
          node --check server/providers/noon.mjs
          node --check server/providers/carrefour.mjs
          node --check server/providers/sharafdg.mjs
          node --check server/providers/swarovski.mjs
          node --check server/providers/amazon-creators.mjs
          node --check server/providers/free-storefronts.mjs
          node --check server/providers/saudi-retailers.mjs
          node --check server/url-resolver.mjs
          node --check server/domain-adapters.mjs
          node --check server/internal-audit.mjs
          node --check scripts/audit-worker.mjs
          node --check scripts/audit-matrix.mjs

  disposable-postgres-provenance:
    # Dedicated isolated PostgreSQL 16 service; never accesses production.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nawaa_ci
          POSTGRES_PASSWORD: test_only_not_a_secret
          POSTGRES_DB: nawaa_temporal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawaa_ci -d nawaa_temporal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Real two-process PostgreSQL replay with test-only data
        env:
          NAWAA_TEST_DATABASE_URL: postgresql://nawaa_ci:test_only_not_a_secret@127.0.0.1:5432/nawaa_temporal_ci
          DATABASE_SSL: "false"
          MEILI_HOST: ""
          MEILI_MASTER_KEY: ""
        run: node --test tests/postgres-provenance.test.mjs

  disposable-meilisearch-restart:
    # Real Meilisearch process in a temporary CI Docker service; no production writes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.10.3
        env:
          MEILI_MASTER_KEY: test_only_meili_master_key_for_ci_20261018
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
    env:
      MEILI_HOST: http://127.0.0.1:7700
      MEILI_MASTER_KEY: test_only_meili_master_key_for_ci_20261018
      MEILI_INDEX: nawaa_ci_replay
      DATABASE_URL: ''
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify isolated search service is responding
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:7700/health | grep -q 'available'; then exit 0; fi
            sleep 1
          done
          echo 'Isolated Meilisearch service failed to start' >&2
          exit 1
      - name: Write historical and fresh Jarir E1 records in first actual Node process
        run: node scripts/certify-real-meili-replay.mjs write
      - name: Restart actual Docker service without deleting index
        run: |
          container=$(docker ps --filter 'ancestor=getmeili/meilisearch:v1.10.3' --format '{{.ID}}' | head -n 1)
          test -n "$container"
          docker restart "$container"
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:7700/health | grep -q 'available'; then exit 0; fi
            sleep 1
          done
          echo 'Isolated Meilisearch did not recover from restart' >&2
          exit 1
      - name: Second Node process verifies durable index and delayed stale overwrite RED
        run: node scripts/certify-real-meili-replay.mjs read
      - name: Deterministic independent-process stale overwrite RED (documented unsafe baseline)
        env:
          MEILI_INDEX: nawaa_ci_multi_instance
        run: node scripts/certify-real-meili-multi-instance.mjs red

  disposable-omega-consistency:
    # Dedicated disposable PostgreSQL + Meilisearch, test-only.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omega_ci
          POSTGRES_PASSWORD: omega_test_only
          POSTGRES_DB: omega_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omega_ci -d omega_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
      meilisearch:
        image: getmeili/meilisearch:v1.10.3
        env:
          MEILI_MASTER_KEY: omega_meili_test_only_key
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
    env:
      NODE_ENV: test
      NAWAA_CANONICAL_INDEX_TEST: '1'
      NAWAA_TEST_DATABASE_URL: postgresql://omega_ci:omega_test_only@127.0.0.1:5432/omega_ci
      MEILI_HOST: http://127.0.0.1:7700
      MEILI_MASTER_KEY: omega_meili_test_only_key
      MEILI_INDEX: nawaa_ci_omega
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Confirm disposable services
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:7700/health | grep -q 'available'; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:7700/health
      - name: Multi-process canonical writes and stale remote task
        run: node scripts/certify-omega-canonical.mjs write
      - name: Restart actual disposable Meilisearch container
        run: |
          container=$(docker ps --filter 'ancestor=getmeili/meilisearch:v1.10.3' --format '{{.ID}}' | head -n 1)
          test -n "$container"
          docker restart "$container"
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:7700/health | grep -q 'available'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Fresh process proves restart recovery and canonical read guard
        run: node scripts/certify-omega-canonical.mjs read

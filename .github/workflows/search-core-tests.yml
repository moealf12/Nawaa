name: Search Core Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Run test suite
        run: npm test
      - name: Live Crawlee smoke test against Jarir Saudi
        if: github.head_ref == 'feature/crawlee-local-ingestion-20261006'
        continue-on-error: true
        run: node scripts/test-crawlee-local.mjs
      - name: Syntax check browser and server modules
        run: |
          node --check src/search-query.mjs
          node --check src/search-page.mjs
          node --check src/product-page.mjs
          node --check server/server.mjs
          node --check server/search-cache.mjs
          node --check server/source-reliability.mjs
          node --check server/providers/ebay.mjs
          node --check server/providers/shopify.mjs
          node --check server/providers/extra-unbxd.mjs
          node --check server/providers/jarir.mjs
          node --check server/providers/noon.mjs
          node --check server/providers/carrefour.mjs
          node --check server/providers/sharafdg.mjs
          node --check server/providers/swarovski.mjs
          node --check server/providers/amazon-creators.mjs
          node --check server/providers/free-storefronts.mjs
          node --check server/providers/saudi-retailers.mjs
          node --check server/url-resolver.mjs
          node --check server/domain-adapters.mjs
          node --check server/internal-audit.mjs
          node --check scripts/audit-worker.mjs
          node --check scripts/audit-matrix.mjs


  zero_cost_postgres_integration:
    name: Verify pg-boss against ephemeral PostgreSQL
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/zero-cost-tooling-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nawaa
          POSTGRES_PASSWORD: nawaa_ci
          POSTGRES_DB: nawaa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawaa -d nawaa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nawaa:nawaa_ci@localhost:5432/nawaa_ci
      DATABASE_SSL: 'false'
      NAWAA_ENABLE_BACKGROUND_JOBS: '1'
      NAWAA_CI_EPHEMERAL_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Exercise real ACID persistence, pg-boss workers and retry idempotency
        run: node scripts/test-zero-cost-postgres-integration.mjs


  install_local_otel:
    name: Pin free local OpenTelemetry dependencies
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/zero-cost-tooling-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zero-cost-tooling-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin free OpenTelemetry API and local SDK
        run: |
          if ! grep -q '"@opentelemetry/sdk-trace-base"' package.json; then
            npm install --save-exact --ignore-scripts @opentelemetry/api @opentelemetry/sdk-trace-base
          fi
      - name: Reproducible lockfile install and test
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Commit validated dependency lockfile to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pin zero-cost OpenTelemetry SDK locally'
            git push origin HEAD:feature/zero-cost-tooling-foundation
          fi

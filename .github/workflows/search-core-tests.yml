name: Search Core Tests

on:
  push:
    branches: [main]
    paths:
      - "src/search-query.mjs"
      - "tests/regressions.test.mjs"
      - "tests/source-coverage.test.mjs"
      - "tests/discovery.test.mjs"
      - "tests/ui-flow.test.mjs"
      - "tests/search-cache.test.mjs"
      - "server/search-cache.mjs"
      - "src/search-core.mjs"
      - "src/search-page.mjs"
      - "src/product-page.mjs"
      - "src/source-registry.mjs"
      - "tests/search-core.test.mjs"
      - "search.html"
      - "product.html"
      - "package.json"
      - "server/server.mjs"
      - "server/match.mjs"
      - "server/fx.mjs"
      - "server/provider-utils.mjs"
      - "server/providers/ebay.mjs"
      - "server/providers/shopify.mjs"
      - "server/providers/extra-unbxd.mjs"
      - "server/providers/jarir.mjs"
      - "server/providers/noon.mjs"
      - "server/providers/carrefour.mjs"
      - "server/providers/sharafdg.mjs"
      - "server/providers/swarovski.mjs"
      - "server/providers/amazon-creators.mjs"
      - "server/providers/brave-discovery.mjs"
      - "server/providers/saudi-retailers.mjs"
      - "server/url-resolver.mjs"
      - "tests/providers.test.mjs"
      - ".github/workflows/search-core-tests.yml"
  pull_request:
    paths:
      - "src/search-query.mjs"
      - "tests/regressions.test.mjs"
      - "tests/ui-flow.test.mjs"
      - "tests/search-cache.test.mjs"
      - "server/search-cache.mjs"
      - "src/search-core.mjs"
      - "src/search-page.mjs"
      - "src/source-registry.mjs"
      - "tests/search-core.test.mjs"
      - "search.html"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run test suite
        run: npm test
      - name: Syntax check browser and server modules
        run: |
          node --check src/search-query.mjs
          node --check src/search-page.mjs
          node --check src/product-page.mjs
          node --check server/server.mjs
          node --check server/search-cache.mjs
          node --check server/providers/ebay.mjs
          node --check server/providers/shopify.mjs
          node --check server/providers/extra-unbxd.mjs
          node --check server/providers/jarir.mjs
          node --check server/providers/noon.mjs
          node --check server/providers/carrefour.mjs
          node --check server/providers/sharafdg.mjs
          node --check server/providers/swarovski.mjs
          node --check server/providers/amazon-creators.mjs
          node --check server/providers/brave-discovery.mjs
          node --check server/providers/saudi-retailers.mjs
          node --check server/url-resolver.mjs

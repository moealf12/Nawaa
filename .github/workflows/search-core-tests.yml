name: Search Core Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Run test suite
        run: npm test
      - name: Live Crawlee smoke test against Jarir Saudi
        if: github.head_ref == 'feature/crawlee-local-ingestion-20261006'
        continue-on-error: true
        run: node scripts/test-crawlee-local.mjs
      - name: Syntax check browser and server modules
        run: |
          node --check src/search-query.mjs
          node --check src/search-page.mjs
          node --check src/product-page.mjs
          node --check server/server.mjs
          node --check server/search-cache.mjs
          node --check server/source-reliability.mjs
          node --check server/providers/ebay.mjs
          node --check server/providers/shopify.mjs
          node --check server/providers/extra-unbxd.mjs
          node --check server/providers/jarir.mjs
          node --check server/providers/noon.mjs
          node --check server/providers/carrefour.mjs
          node --check server/providers/sharafdg.mjs
          node --check server/providers/swarovski.mjs
          node --check server/providers/amazon-creators.mjs
          node --check server/providers/free-storefronts.mjs
          node --check server/providers/saudi-retailers.mjs
          node --check server/url-resolver.mjs
          node --check server/domain-adapters.mjs
          node --check server/internal-audit.mjs
          node --check scripts/audit-worker.mjs
          node --check scripts/audit-matrix.mjs


  zero_cost_dependency_lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/zero-cost-tooling-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zero-cost-tooling-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and pin packages
        run: |
          if grep -q '"pg-boss"' package.json; then
            echo 'Already installed; skip version changes'
          else
            npm install --save-exact --ignore-scripts zod p-queue pg-boss
          fi
      - name: Verify from lockfile
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Commit consistent lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Install and pin Zod, p-queue and pg-boss for zero-cost background tools'
            git push origin HEAD:feature/zero-cost-tooling-foundation
          fi

      - "tests/audit-contract.test.mjs"
      - "tests/source-probe.test.mjs"
      - "tests/audit-cli.test.mjs"
      - "src/search-query.mjs"
      - "tests/regressions.test.mjs"
      - "tests/source-coverage.test.mjs"
      - "tests/discovery.test.mjs"
      - "tests/ui-flow.test.mjs"
      - "tests/product-page-ui.test.mjs"
      - "tests/search-cache.test.mjs"
      - "tests/source-reliability.test.mjs"
      - "server/search-cache.mjs"
      - "server/source-reliability.mjs"
      - "src/search-core.mjs"
      - "src/search-page.mjs"
      - "src/product-page.mjs"
      - "src/source-registry.mjs"
      - "tests/search-core.test.mjs"
      - "search.html"
      - "product.html"
      - "package.json"
      - "server/server.mjs"
      - "server/match.mjs"
      - "server/fx.mjs"
      - "server/provider-utils.mjs"
      - "server/providers/ebay.mjs"
      - "server/providers/shopify.mjs"
      - "server/providers/extra-unbxd.mjs"
      - "server/providers/jarir.mjs"
      - "server/providers/noon.mjs"
      - "server/providers/carrefour.mjs"
      - "server/providers/sharafdg.mjs"
      - "server/providers/swarovski.mjs"
      - "server/providers/amazon-creators.mjs"
      - "server/providers/free-storefronts.mjs"
      - "server/providers/saudi-retailers.mjs"
      - "server/url-resolver.mjs"
      - "server/shopify-page-variant.mjs"
      - "server/product-variant.mjs"
      - "server/product-identity.mjs"
      - "server/product-reconciliation.mjs"
      - "tests/price-identity.test.mjs"
      - "tests/shopify.test.mjs"
      - "server/domain-adapters.mjs"
      - "tests/domain-adapters.test.mjs"
      - "tests/providers.test.mjs"
      - "server/persistence.mjs"
      - "server/search-index.mjs"
      - "server/pim-bridge.mjs"
      - "server/ingestion.mjs"
      - "tests/ingestion.test.mjs"
      - "tests/ebay-notifications.test.mjs"
      - "workers/crawler/**"
      - ".github/workflows/search-core-tests.yml"
  pull_request:
    paths:
      - "server/internal-audit.mjs"
      - "server/audit-matrix.mjs"
      - "scripts/audit-worker.mjs"
      - "scripts/audit-matrix.mjs"
      - "tests/internal-audit.test.mjs"
      - "tests/audit-matrix.test.mjs"
      - "server/audit-contract.mjs"
      - "server/source-config.mjs"
      - "server/source-probe.mjs"
      - "scripts/audit-source.mjs"
      - "tests/audit-contract.test.mjs"
      - "tests/source-probe.test.mjs"
      - "tests/audit-cli.test.mjs"
      - "src/search-query.mjs"
      - "tests/regressions.test.mjs"
      - "tests/ui-flow.test.mjs"
      - "tests/product-page-ui.test.mjs"
      - "src/product-page.mjs"
      - "package.json"
      - "tests/search-cache.test.mjs"
      - "tests/source-reliability.test.mjs"
      - "server/search-cache.mjs"
      - "server/source-reliability.mjs"
      - "src/search-core.mjs"
      - "src/search-page.mjs"
      - "src/source-registry.mjs"
      - "tests/search-core.test.mjs"
      - "search.html"

      - "server/url-resolver.mjs"
      - "server/shopify-page-variant.mjs"
      - "server/product-variant.mjs"
      - "server/product-identity.mjs"
      - "server/product-reconciliation.mjs"
      - "server/providers/shopify.mjs"
      - "tests/price-identity.test.mjs"
      - "tests/shopify.test.mjs"
      - "server/persistence.mjs"
      - "server/search-index.mjs"
      - "server/pim-bridge.mjs"
      - "server/ingestion.mjs"
      - "tests/ingestion.test.mjs"
      - "tests/ebay-notifications.test.mjs"
      - "workers/crawler/**"
      - ".github/workflows/search-core-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run test suite
        run: npm test
      - name: Syntax check browser and server modules
        run: |
          node --check src/search-query.mjs
          node --check src/search-page.mjs
          node --check src/product-page.mjs
          node --check server/server.mjs
          node --check server/search-cache.mjs
          node --check server/source-reliability.mjs
          node --check server/providers/ebay.mjs
          node --check server/providers/shopify.mjs
          node --check server/providers/extra-unbxd.mjs
          node --check server/providers/jarir.mjs
          node --check server/providers/noon.mjs
          node --check server/providers/carrefour.mjs
          node --check server/providers/sharafdg.mjs
          node --check server/providers/swarovski.mjs
          node --check server/providers/amazon-creators.mjs
          node --check server/providers/free-storefronts.mjs
          node --check server/providers/saudi-retailers.mjs
          node --check server/url-resolver.mjs
          node --check server/domain-adapters.mjs
          node --check server/internal-audit.mjs
          node --check scripts/audit-worker.mjs
          node --check scripts/audit-matrix.mjs

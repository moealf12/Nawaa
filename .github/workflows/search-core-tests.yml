name: Search Core Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "workers/**"
      - "scripts/**"
      - "*.html"
      - "package*.json"
      - ".github/workflows/search-core-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Run test suite
        run: npm test
      - name: Live Crawlee smoke test against Jarir Saudi
        if: github.head_ref == 'feature/crawlee-local-ingestion-20261006'
        continue-on-error: true
        run: node scripts/test-crawlee-local.mjs
      - name: Syntax check browser and server modules
        run: |
          node --check src/search-query.mjs
          node --check src/search-page.mjs
          node --check src/product-page.mjs
          node --check server/server.mjs
          node --check server/search-cache.mjs
          node --check server/source-reliability.mjs
          node --check server/providers/ebay.mjs
          node --check server/providers/shopify.mjs
          node --check server/providers/extra-unbxd.mjs
          node --check server/providers/jarir.mjs
          node --check server/providers/noon.mjs
          node --check server/providers/carrefour.mjs
          node --check server/providers/sharafdg.mjs
          node --check server/providers/swarovski.mjs
          node --check server/providers/amazon-creators.mjs
          node --check server/providers/free-storefronts.mjs
          node --check server/providers/saudi-retailers.mjs
          node --check server/url-resolver.mjs
          node --check server/domain-adapters.mjs
          node --check server/internal-audit.mjs
          node --check scripts/audit-worker.mjs
          node --check scripts/audit-matrix.mjs

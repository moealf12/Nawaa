name: Noon UAE LIVE PLP Price Precision

on:
  push:
    branches:
      - experiment/noon-ae-sa-catalog-proof-20261105
    paths:
      - "scripts/noon-uae-plp-money-live.py"
      - ".github/workflows/noon-uae-plp-money-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noon-uae-plp-money-live
  cancel-in-progress: true

jobs:
  real-plp-price-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned UAE source libraries
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            curl_cffi==0.17.0 beautifulsoup4==4.15.0 ruff
      - name: Compile and lint no-PDP source diagnostic
        run: |
          python -m py_compile scripts/noon-uae-plp-money-live.py
          ruff check --select E4,E7,E9,F scripts/noon-uae-plp-money-live.py
      - name: LIVE merchant HTML, 3 unrelated queries, max 4 requests
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.sha }}
        run: python scripts/noon-uae-plp-money-live.py
      - name: Preserve real counts and whitelisted money evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-uae-plp-price-evidence
          path: noon-uae-plp-money-live.json
          retention-days: 14
          if-no-files-found: warn

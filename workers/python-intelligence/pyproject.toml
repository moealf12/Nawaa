[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "nawaa-intelligence"
version = "1.0.0"
description = "Evidence-first Python HTTP extraction and deterministic product variant classification for NAWAA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "beautifulsoup4>=4.12.3,<5",
  "lxml>=5.1,<7",
  "pydantic>=2.6,<3",
  "rapidfuzz>=3.6,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["nawaa_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
